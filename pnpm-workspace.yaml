# pnpm settings. Build approval lives here rather than in `package.json`: pnpm 11
# reads every setting except auth and registry from this file.
#
# `esbuild: false` denies its postinstall. That script downloads nothing — it
# copies the platform binary that `@esbuild/win32-x64` already ships as an
# ordinary optional dependency, and `transformSync` was verified to work with
# the script denied. npm blocked the same script, so denying it keeps the
# migration like-for-like instead of granting the tree a privilege it never had.
#
# A package listed in neither direction is treated as unreviewed and fails the
# install, which is the point: a new dependency cannot begin running install
# scripts unnoticed.
allowBuilds:
  esbuild: false

# rolldown 1.2.2 — what vite 8.2's `~1.2.0` resolved to — folds a string
# concatenation containing a lone-surrogate escape into U+FFFD, which broke
# temml's lexer in the shipped chunk: every client-rendered `\command` came out
# as letters. 1.2.9 writes the escape back correctly. Drop this once the vite
# Astro resolves requires a fixed rolldown itself.
# `tests/built-output.test.ts` 'the bundled math renderer still reads control words'.
overrides:
  rolldown: 1.2.9
