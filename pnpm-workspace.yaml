# pnpm settings. Build approval lives here rather than in `package.json`: pnpm 11
# reads every setting except auth and registry from this file.
#
# `esbuild: false` denies its postinstall. That script downloads nothing — it
# copies the platform binary that `@esbuild/win32-x64` already ships as an
# ordinary optional dependency, and `transformSync` was verified to work with
# the script denied. npm blocked the same script, so denying it keeps the
# migration like-for-like instead of granting the tree a privilege it never had.
#
# A package listed in neither direction is treated as unreviewed and fails the
# install, which is the point: a new dependency cannot begin running install
# scripts unnoticed.
allowBuilds:
  esbuild: false
  # aws4fetch 1.0.20 is the pinned SigV4 signer for optional R2 publishing. It
  # ships plain JavaScript with no install script, no native binding, and no
  # transitive dependencies, so there is nothing to grant. Listing it as denied
  # records that it was reviewed rather than leaving it unreviewed; the entry
  # changes nothing at install time.
  aws4fetch: false

# rolldown 1.2.2 — what vite 8.2's `~1.2.0` resolved to at the time — folds a
# string concatenation containing a lone-surrogate escape into U+FFFD, which
# broke temml's lexer in the shipped chunk: every client-rendered `\command`
# came out as letters. 1.2.9 writes the escape back correctly, and the only
# evidence this hold rests on is the output gate it names below — the shipped
# chunk, not a declared range.
#
# The automatic drop condition this comment used to carry ("drop once the vite
# Astro resolves requires a fixed rolldown") is gone on purpose. The consumers'
# ranges have since moved past the hold: astro 7.4.8 asks for `rolldown ~1.2.16`
# and its vite 8.3.8 for `~1.2.18`, so pnpm now installs 1.2.9 below both
# declared ranges. A satisfied range is not proof that the newer bundler writes
# temml's control words correctly; no measurement here shows the newer versions
# are defective either, so the hold is kept until someone measures the output.
#
# Ablation before removing it: delete this override, re-resolve the lock, run
# `pnpm run build`, and confirm `tests/built-output.test.ts` — 'the bundled math
# renderer still reads control words' — still passes: no U+FFFD in any shipped
# script, and temml's chunk turns `\alpha` into `<mi>α</mi>`. Restore the
# override if it does not.
overrides:
  rolldown: 1.2.9
