<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320">
  <title>Clip paths</title>
  <defs>
    <clipPath id="rounded" clipPathUnits="userSpaceOnUse">
      <rect x="40" y="40" width="220" height="160" rx="28"/>
    </clipPath>
    <clipPath id="triangle" clipPathUnits="userSpaceOnUse">
      <path d="M380 240 L470 60 L540 240 Z"/>
    </clipPath>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c08c"/>
      <stop offset="1" stop-color="#f08c8c"/>
    </linearGradient>
  </defs>
  <rect width="560" height="320" fill="#ffffff"/>
  <g clip-path="url(#rounded)">
    <rect x="20" y="20" width="280" height="220" fill="#86c8e6"/>
    <circle cx="220" cy="200" r="90" fill="url(#warm)"/>
  </g>
  <g clip-path="url(#triangle)">
    <rect x="340" y="40" width="220" height="220" fill="#8ad884"/>
    <circle cx="430" cy="160" r="80" fill="#3c4652" fill-opacity="0.45"/>
  </g>
</svg>
