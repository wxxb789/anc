<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <title>Gradients and a pattern</title>
  <defs>
    <linearGradient id="linear" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#86c8e6"/>
      <stop offset="1" stop-color="#8ad884"/>
    </linearGradient>
    <radialGradient id="radial" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f08c8c" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f08c8c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#3c4652"/>
    </pattern>
  </defs>
  <rect width="600" height="300" fill="url(#linear)"/>
  <circle cx="200" cy="150" r="130" fill="url(#radial)"/>
  <rect x="380" y="40" width="180" height="220" fill="url(#dots)"/>
</svg>
