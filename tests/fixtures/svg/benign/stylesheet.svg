<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240">
  <title>Style sheet</title>
  <style>
    .panel { fill: url(#fade); stroke: #3c4652; stroke-width: 2; }
    .label { fill: #161b21; font-family: "DejaVu Sans", sans-serif; font-size: 20px; }
    .accent { fill: #f08c8c; fill-opacity: 0.8; }
  </style>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86c8e6"/>
      <stop offset="1" stop-color="#8ad884"/>
    </linearGradient>
  </defs>
  <rect class="panel" x="20" y="20" width="200" height="200" rx="18"/>
  <circle class="accent" cx="340" cy="120" r="80"/>
  <text class="label" x="40" y="120">CSS class</text>
</svg>
