# Runs `pnpm run build:fixture` on a schedule and on demand.
#
# About 34 gates skip under `pnpm run verify`, because the synthetic content the
# default build uses has one entry and those gates need several: bilingual
# pages, graph edges, aliases, search across notes. `build:fixture` rebuilds the
# site from the 32-note corpus and runs the whole suite against it. It is not in
# `verify.yml` because it builds the site twice and takes several times longer;
# nightly keeps those gates from rotting unseen between manual runs.
#
# Like `verify.yml`, it lists no gates: `build:fixture` is one `package.json`
# script, so a gate added there is added here. The setup steps mirror
# `verify.yml` (pinned Node and pnpm, frozen lockfile, Chromium, the pinned
# scanner) because the fixture run needs the same toolchain. It deploys nothing,
# needs no secrets, and its token cannot write.
name: fixture

on:
  schedule:
    # 03:17 UTC daily, off the hour to avoid the scheduler's top-of-hour load.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-build-fixture-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: bash .github/scripts/install-gitleaks.sh

      - run: pnpm run build:fixture
