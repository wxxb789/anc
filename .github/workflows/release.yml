# One-click release: computes the next version from a bump level, moves the
# `Unreleased` CHANGELOG section under it, commits both to `main`, tags the
# commit, and dispatches `release-npm.yml` on that tag.
#
# Why a dispatch and not a tag push: a tag pushed with this repository's own
# `GITHUB_TOKEN` starts no `push` workflow, and a `workflow_call` would make
# npm's trusted publisher validate *this* workflow's filename instead of
# `release-npm.yml` — the dispatch is the route that keeps both the trigger and
# the OIDC identity right. Publishing then runs from the tag's tree, so the
# tarball and its provenance point at the release commit.
#
# Two jobs, because the token is the privilege. `version` computes and checks
# behind `contents: read` and persists no credentials; `tag` holds the write
# token and runs two commands — `npm version` with lifecycle scripts disabled,
# and one `node scripts/release-changelog.ts` call. Nothing else runs with a
# push credential, and no dependency is installed in either job.
#
# The release commit changes exactly `package.json` and `CHANGELOG.md`; the
# `tag` job refuses anything else, so a release cannot carry code that skipped
# review. Publishing still re-runs `verify`, `build:fixture` and
# `smoke:tarball` at the tag before the registry sees a byte.
#
# This cannot perform the first publish — a trusted publisher needs a package
# page that exists. `CONTRIBUTING.md` records that one manual step.
name: release

on:
  workflow_dispatch:
    inputs:
      level:
        description: 'Version bump'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# Astro's anonymous usage telemetry has no business in a CI log or on the wire.
env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-version-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      # A dispatched run can start from a commit whose verification is still
      # running or already red, so the `verify` run for this exact commit is the
      # authority. A missing run is normal one commit after a release: the bot's
      # push starts no workflow, so the next release needs the next human commit.
      - name: Require a green verify run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow verify.yml --commit "$GITHUB_SHA" --event push --limit 1 --json conclusion --jq '.[0].conclusion // "missing"')"
          if [ "$conclusion" != "success" ]; then
            echo "verify for $GITHUB_SHA is '$conclusion'." >&2
            echo "Release from a commit whose verify run is green; after a release, land the next change first." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # `--no-git-tag-version` edits the manifest and stops; `--ignore-scripts`
      # keeps a `version` lifecycle hook from running with a release token.
      - name: Compute the version and refuse a taken tag
        id: bump
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          npm version "$LEVEL" --no-git-tag-version --ignore-scripts > /dev/null
          version="$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "tag v$version already exists on origin" >&2
            exit 1
          fi
          node scripts/release-changelog.ts "$version" --check
          echo "version=$version" >> "$GITHUB_OUTPUT"

  tag:
    name: tag
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-tag-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Commit the version and the notes, tag, and push atomically
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --ignore-scripts > /dev/null
          node scripts/release-changelog.ts "$VERSION"
          changed="$(git status --porcelain --untracked-files=no | awk '{ print $2 }' | sort | tr '\n' ' ')"
          if [ "$changed" != "CHANGELOG.md package.json " ]; then
            echo "a release commit may change only CHANGELOG.md and package.json, found: $changed" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(release): v$VERSION" -- CHANGELOG.md package.json
          git tag -a "v$VERSION" -m "v$VERSION"
          # --atomic leaves neither ref behind if `main` moved during the run.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"

      # The moving pointer an Action user may follow: `v0` for 0.x, `v1` from
      # 1.0. Force-updated on every release by design, which is exactly why it is
      # never what a release itself is pinned to.
      - name: Move the major tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          major="v${VERSION%%.*}"
          git tag -f "$major" "v$VERSION^{commit}"
          git push --force origin "refs/tags/$major"

      - name: Dispatch publishing on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh workflow run release-npm.yml --ref "v$VERSION"
