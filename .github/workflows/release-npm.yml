# Publishes `@wxxb789/anc` to npm when a release tag exists: from a pushed tag, or
# dispatched on one by `release.yml`'s one-click path.
#
# This is the one thing `verify.yml` deliberately cannot do. Verification holds
# a read-only token on purpose, so a green build can never become publication
# authority; publication is a separately approved external action, and the
# approval is the act of starting a release — pushing a tag, or starting the
# one-click `release` run. The job therefore carries a credential
# — but not a stored one. It exchanges a GitHub Actions OIDC identity for a
# short-lived npm publish token ("trusted publishing"), so this repository keeps
# no npm token, and every publish is bound to this workflow file at this commit.
# Provenance is generated automatically from that exchange, and the registry
# records which repository and commit produced the tarball.
#
# Three facts this file depends on, each a way it can stop working while still
# looking correct:
#
#   * `id-token: write` is the credential. Without it npm has nothing to
#     exchange and reports ENEEDAUTH.
#   * The "Workflow filename" on the package's npmjs.com trusted-publisher form
#     must be `release-npm.yml` exactly — the filename, not this path, and no
#     other workflow name.
#   * The npm CLI must be at least 11.5.1. The gate below reads the version the
#     runner actually has rather than assuming Node's bundled npm is new
#     enough, because the failure otherwise appears as an auth error.
#
# The tag is the release boundary, so the gates run again here instead of
# trusting that the commit was green when it merged: a tag can point at any
# commit. Each is invoked as its own `package.json` script rather than restated,
# so a gate added to `verify` arrives here with nothing to update; the two the
# contributor guide lists as release-only (`build:fixture`, `smoke:tarball`)
# are named because they sit in no other chain. The published bytes are the
# tarball `smoke:tarball` installed and exercised, not a second pack.
#
# This publishes a package; it deploys nothing. Deployment remains a separate,
# explicitly approved step, and this job has no access to a site origin.
name: release-npm

on:
  push:
    tags:
      - 'v*.*.*'
  # Dispatched on a `vX.Y.Z` tag by `release.yml`, which is the one-click path;
  # also re-runnable by hand on a tag. A tag pushed with this repository's own
  # `GITHUB_TOKEN` starts no `push` workflow, so the dispatch is what makes the
  # automated release reach this file at all.
  workflow_dispatch:

# `id-token: write` is the trusted-publishing credential described above.
# `contents: read` is checkout and nothing else: this job pushes no tag, creates
# no release, and cannot write to the repository. The GitHub release is a
# separate, maintainer-run step — `CONTRIBUTING.md` names the command — so that
# its notes stay the curated `CHANGELOG.md` section rather than whatever GitHub
# infers between tags.
permissions:
  contents: read
  id-token: write

# Astro's anonymous usage telemetry has no business in a CI log or on the wire.
env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  publish:
    runs-on: ubuntu-latest
    # Three full gate runs plus two installs and a browser. A hung install or
    # browser should fail in bounded time rather than hold a runner for the
    # six-hour default. `tests/verify.test.ts` requires this key on every job.
    timeout-minutes: 45
    # One release at a time, and never cancelled: an interrupted publish is the
    # one outcome with no clean rollback, because a version cannot be
    # overwritten once the registry has accepted it.
    concurrency:
      group: ${{ github.workflow }}-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # The default depth. Nothing here reads history: provenance takes its
      # commit from the workflow environment, and the tarball comes from the
      # checked-out tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before anything is installed or built: a tag that does not name the
      # version in the manifest publishes the wrong thing or nothing, and the
      # cheap check should be the one that fails.
      - name: Check the tag names the manifest version
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (tag !== version) {
              console.error('tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json version ' + version);
              process.exit(1);
            }
            console.log('releasing ' + tag);
          "

      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false

      # No `registry-url`. That input exists to write an `_authToken` into
      # `.npmrc` from a `NODE_AUTH_TOKEN` secret, and this workflow has no such
      # secret: the exchange above is the only credential, and it is attached to
      # the publish itself. Omitting the input keeps a failure here an OIDC
      # failure instead of a 401 about a token-shaped string that is not a token.
      #
      # `node-version-file` rather than a literal version, for the same reason
      # `verify.yml` gives: `.nvmrc` is the existing pin.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The OIDC exchange needs npm 11.5.1 or later. Node 24.18.1 ships 11.16.0,
      # but the pin lives in `.nvmrc` and can move, and the failure a stale npm
      # produces is an authentication error that names none of this. Read the
      # version the runner actually has, after the pin above has selected it.
      - name: Check the npm CLI supports trusted publishing
        run: |
          node --input-type=module -e "
            import { execFileSync } from 'node:child_process';
            const current = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
            const [major, minor, patch] = current.split('.').map(Number);
            const supported = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!supported) throw new Error('npm ' + current + ' predates trusted publishing; 11.5.1 or later is required');
            console.log('npm ' + current + ' supports trusted publishing');
          "

      - run: pnpm install --frozen-lockfile

      # The rendered-browser gates skip when no browser is installed, which in
      # CI would be a green run that skipped them. The adoption smoke also
      # drives the built artifact through its own Worker and WASM.
      - run: pnpm exec playwright install --with-deps chromium

      - run: bash .github/scripts/install-gitleaks.sh

      - run: pnpm run verify

      - run: pnpm run build:fixture

      # Packs the compiled tarball and installs it into a synthetic foreign
      # notes repository, then reads the artifact as a stranger would. The
      # tarball it leaves at the repository root is what gets published, so the
      # bytes that reach the registry are the bytes this gate exercised.
      - run: pnpm run smoke:tarball

      - name: Publish the tarball the smoke run installed
        run: |
          version="$(node -p "require('./package.json').version")"
          tarball="wxxb789-anc-${version}.tgz"
          test -f "$tarball" || { echo "smoke:tarball left no $tarball to publish" >&2; exit 1; }
          npm publish "./$tarball" --access public
